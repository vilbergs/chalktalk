[package]
name = "chalktalk"
version = "0.1.0"
description = "Winger's board: hockey positioning trainer"
authors = ["Vilberg"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chalktalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"

# libc 0.2.190 limits `mach_task_self` to macOS (0.2.185 does not), which breaks `num_threads`
# (tauri -> cookie -> time) when building for iOS. Cargo resolves one libc 0.2.x for the
# whole graph, so this exact requirement holds every crate to it. Remove once fixed upstream.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.185"
